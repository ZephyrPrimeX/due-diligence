:root{
  --bg:#F3F4F8; --bg2:#EBEDF3; --card:#FFFFFF; --card2:#F7F8FB; --text:#0F1222; --text2:#5B6072; --text3:#9095A6;
  --line:rgba(15,18,34,.07); --line2:rgba(15,18,34,.12);
  --accent:#5B5BF0; --accent2:#7C6CFF; --accentSoft:rgba(91,91,240,.10);
  --good:#12A86B; --goodSoft:rgba(18,168,107,.12); --warn:#E08A00; --warnSoft:rgba(224,138,0,.13); --bad:#E5484D; --badSoft:rgba(229,72,77,.11);
  --shadow:0 1px 2px rgba(16,20,45,.04),0 6px 20px -8px rgba(16,20,45,.10);
  --shadow2:0 24px 60px -20px rgba(30,30,90,.35);
  --r:20px; --track:#E7E9F0; --ease:cubic-bezier(.22,.8,.26,1);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --tab-h:calc(78px + max(0px, var(--sab) - 12px));
}
[data-theme="dark"]{
  --bg:#0B0C12; --bg2:#14161F; --card:#161822; --card2:#1D2030; --text:#F2F3F8; --text2:#A3A8BC; --text3:#6C7186;
  --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.11);
  --accent:#8B8BFF; --accent2:#A594FF; --accentSoft:rgba(139,139,255,.14);
  --good:#3DD68C; --goodSoft:rgba(61,214,140,.13); --warn:#FFB224; --warnSoft:rgba(255,178,36,.13); --bad:#FF6369; --badSoft:rgba(255,99,105,.13);
  --track:#2A2D3D; --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"InterDemo",Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;color:var(--text);
  background:var(--bg);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";letter-spacing:-.01em;transition:background .35s}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum","cv11","ss01"}
.app{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);transition:background .35s}
@media (min-width:640px){
  body{background:radial-gradient(1200px 700px at 15% 10%,#E4E3FF 0,transparent 60%),radial-gradient(900px 600px at 90% 90%,#DCF1FF 0,transparent 60%),#EEF0F6;
    display:flex;align-items:center;justify-content:center;min-height:100vh}
  [data-theme="dark"] body,body.dark{background:radial-gradient(1200px 700px at 15% 10%,#1E1B4B 0,transparent 60%),radial-gradient(900px 600px at 90% 90%,#0C2A3D 0,transparent 60%),#06070B}
  .app{width:420px;height:min(880px,calc(100vh - 48px));border-radius:42px;box-shadow:var(--shadow2),0 0 0 10px rgba(255,255,255,.55),0 0 0 11px rgba(15,18,34,.06)}
  body.dark .app{box-shadow:var(--shadow2),0 0 0 10px rgba(255,255,255,.05),0 0 0 11px rgba(255,255,255,.06)}
  .desk-note{display:block!important}
}
.desk-note{display:none;position:fixed;left:24px;bottom:20px;font-size:12px;color:var(--text3)}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 18px calc(var(--tab-h) + 28px);scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.screen.enter{animation:fadeUp .42s var(--ease) both}
.screen.push{z-index:30;background:var(--bg);padding-bottom:40px;animation:pushIn .42s var(--ease) both;box-shadow:-20px 0 40px -20px rgba(0,0,0,.25)}
.screen.push.leaving{animation:pushOut .32s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes pushOut{from{transform:none}to{transform:translateX(100%)}}
.stagger>*{animation:fadeUp .5s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.04s}.stagger>*:nth-child(3){animation-delay:.08s}.stagger>*:nth-child(4){animation-delay:.12s}
.stagger>*:nth-child(5){animation-delay:.16s}.stagger>*:nth-child(6){animation-delay:.2s}.stagger>*:nth-child(7){animation-delay:.24s}.stagger>*:nth-child(n+8){animation-delay:.28s}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 14px;gap:12px}
.top h1{font-size:28px;font-weight:750;letter-spacing:-.035em;margin:0}
.top .sub{font-size:13px;color:var(--text2);margin-top:2px;font-weight:500}
.hello{font-size:13px;color:var(--text2);font-weight:550}
.hello b{display:block;font-size:22px;color:var(--text);letter-spacing:-.03em;font-weight:750;margin-top:2px}
.icon-btn{width:40px;height:40px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--text);transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.accent{background:var(--accent);color:#fff;box-shadow:0 8px 20px -8px var(--accent)}
.icons{display:flex;gap:8px}
.demo-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);
  background:var(--card2);border:1px solid var(--line);padding:3px 8px;border-radius:99px;margin-top:6px}
.demo-pill i{width:6px;height:6px;border-radius:50%;background:var(--warn);display:block}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;position:relative;transition:background .35s}
.card.tight{padding:6px 0}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-h h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.02em}
.link{color:var(--accent);font-size:13px;font-weight:650;display:inline-flex;align-items:center;gap:2px}
.sec-t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.sec-t span.num{letter-spacing:0;text-transform:none;font-size:13px;color:var(--text2);font-weight:650}
.sec-t span.lite{color:var(--text3);font-weight:600;font-size:12px}

/* hero */
.hero{border-radius:26px;padding:22px 20px 18px;color:#fff;position:relative;overflow:hidden;margin-bottom:14px;
  background:linear-gradient(135deg,#25265E 0%,#4338CA 55%,#7C5CFF 100%);box-shadow:0 20px 40px -18px rgba(67,56,202,.65)}
[data-theme="dark"] .hero{background:linear-gradient(135deg,#1B1C45 0%,#3730A3 55%,#6D4CF0 100%)}
.hero:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-120px;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.hero:after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;left:-60px;bottom:-130px;background:radial-gradient(circle,rgba(125,211,252,.35),transparent 65%)}
.hero .lbl{font-size:13px;opacity:.78;font-weight:550;display:flex;align-items:center;gap:6px}
.hero .big{font-size:40px;font-weight:780;letter-spacing:-.045em;margin:4px 0 2px;line-height:1.1}
.hero .big .c{font-size:22px;opacity:.65;font-weight:650}
.hero .meta{font-size:13px;opacity:.75}
.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;position:relative;z-index:1}
.glass{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);border-radius:16px;padding:11px 12px}
.glass .k{font-size:11.5px;opacity:.75;font-weight:550}
.glass .v{font-size:17px;font-weight:720;margin-top:3px;letter-spacing:-.02em}
.eye{position:absolute;right:16px;top:16px;z-index:2;width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.13);display:grid;place-items:center;color:#fff}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;width:100%;text-align:left;transition:background .15s}
button.row:active,.row.tap:active{background:var(--card2)}
.row+.row:before{content:"";position:absolute;left:68px;right:16px;top:0;height:1px;background:var(--line)}
.av{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:750;font-size:13.5px;color:#fff;flex:none;letter-spacing:-.02em;position:relative}
.av.lg{width:56px;height:56px;border-radius:18px;font-size:18px}
.av.sm{width:32px;height:32px;border-radius:10px;font-size:11.5px}
.row .mid{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:650;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none}
.row .r .t{font-variant-numeric:tabular-nums}
.chev{color:var(--text3)}
.bar{height:6px;border-radius:9px;background:var(--track);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:9px;transition:width .8s var(--ease)}
.dots{display:flex;gap:4px;margin-top:8px}
.dots i{flex:1;height:6px;border-radius:9px;background:var(--track)}
.dots i.on{background:var(--c,var(--accent))}
.dots i.late{background:var(--bad)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:3px 8px;border-radius:99px;white-space:nowrap}
.chip.bad{background:var(--badSoft);color:var(--bad)}.chip.warn{background:var(--warnSoft);color:var(--warn)}
.chip.good{background:var(--goodSoft);color:var(--good)}.chip.mute{background:var(--bg2);color:var(--text2)}.chip.acc{background:var(--accentSoft);color:var(--accent)}

/* segmented */
.seg{display:flex;background:var(--bg2);border-radius:13px;padding:3px;position:relative;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-size:13px;font-weight:620;color:var(--text2);transition:all .25s var(--ease);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08),0 2px 8px -2px rgba(0,0,0,.08)}
.seg.sm button{padding:6px 10px;font-size:12px}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 4px}
.filters::-webkit-scrollbar{display:none}
.pill{padding:8px 14px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:620;color:var(--text2);white-space:nowrap;transition:all .2s}
.pill.on{background:var(--text);color:var(--bg)}

/* tabbar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:var(--tab-h);z-index:20;display:flex;justify-content:space-around;align-items:flex-start;padding:9px 8px 0;
  background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:620;color:var(--text3);width:64px;padding:4px 0;transition:color .2s;position:relative}
.tab svg.i{width:23px;height:23px;transition:transform .3s var(--ease)}
.tab.on{color:var(--accent)}
.tab.on svg.i{transform:translateY(-1px) scale(1.06)}
.tab .badge{position:absolute;top:0;right:14px;min-width:16px;height:16px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:750;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:18px}
.donut{position:relative;width:132px;height:132px;flex:none}
.donut svg{transform:rotate(-90deg)}
.donut circle{transition:stroke-dasharray .9s var(--ease),stroke-dashoffset .9s var(--ease)}
.donut .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .ctr b{display:block;font-size:17px;font-weight:750;letter-spacing:-.03em}
.donut .ctr small{font-size:11px;color:var(--text3);font-weight:600}
.legend{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend span{flex:1;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend b{font-weight:650;font-variant-numeric:tabular-nums}
.legend em{font-style:normal;color:var(--text3);font-size:11.5px;width:30px;text-align:right}

/* next payment */
.next{display:flex;align-items:center;gap:14px}
.next .when{font-size:12px;font-weight:650;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.next .amt{font-size:24px;font-weight:760;letter-spacing:-.035em}
.ring{width:54px;height:54px;flex:none;position:relative}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:760;line-height:1;text-align:center}
.ring b small{display:block;font-size:9px;color:var(--text3);font-weight:650;margin-top:2px}

.alert{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:16px;background:var(--badSoft);color:var(--bad);margin-bottom:14px;width:100%;text-align:left}
.alert .mid{flex:1;font-size:13px;line-height:1.35;color:var(--text)}
.alert .mid b{color:var(--bad)}

/* debt-free */
.free{background:linear-gradient(135deg,var(--goodSoft),transparent 70%),var(--card)}
.free .big{font-size:24px;font-weight:760;letter-spacing:-.035em;margin:2px 0}
.free .tag{font-size:12px;font-weight:700;color:var(--good);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}

/* insights */
.ins{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left}
.ins .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.ins .ic.bad{background:var(--badSoft);color:var(--bad)}.ins .ic.warn{background:var(--warnSoft);color:var(--warn)}
.ins .ic.good{background:var(--goodSoft);color:var(--good)}.ins .ic.acc{background:var(--accentSoft);color:var(--accent)}
.ins h4{margin:1px 0 4px;font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.ins p{margin:0;font-size:13.5px;color:var(--text2);line-height:1.45}
.ins .go{margin-top:10px}
.ins-scroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px 14px;padding:2px 18px 6px;scrollbar-width:none}
.ins-scroll::-webkit-scrollbar{display:none}
.ins-scroll .card{min-width:82%;scroll-snap-align:start;margin:0}

/* detail */
.dh{display:flex;align-items:center;gap:10px;padding:18px 0 8px;position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -18px;padding-left:12px;padding-right:12px}
.dh .ttl{flex:1;text-align:center;font-weight:680;font-size:15px;opacity:0;transition:opacity .2s}
.dh.scrolled .ttl{opacity:1}
.dhero{text-align:center;padding:6px 0 18px}
.dhero .av{margin:0 auto 12px}
.dhero h2{margin:0;font-size:20px;font-weight:720;letter-spacing:-.03em}
.dhero .s{color:var(--text2);font-size:13px;margin-top:3px}
.dhero .big{font-size:40px;font-weight:780;letter-spacing:-.045em;margin-top:12px}
.dhero .big .c{font-size:22px;color:var(--text3)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--text2);font-weight:560;display:flex;align-items:center;gap:5px}
.stat .v{font-size:18px;font-weight:730;margin-top:4px;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--text3);font-weight:600}
.util-big{display:flex;justify-content:space-between;align-items:baseline}
.util-big b{font-size:28px;font-weight:780;letter-spacing:-.04em}
.bar.lg{height:10px;margin-top:10px}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-top:6px}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b i{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;display:block;transition:height .8s var(--ease)}
.bars .b span{font-size:11px;color:var(--text3);font-weight:600}
.bars .b em{font-style:normal;font-size:11px;font-weight:680;color:var(--text2)}
.note{font-size:12.5px;color:var(--text2);line-height:1.45;background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:12px}
.sched .row{padding:11px 16px}
.stamp{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:11px;font-weight:750}
.stamp.paid{background:var(--goodSoft);color:var(--good)}.stamp.due{background:var(--accentSoft);color:var(--accent)}.stamp.late{background:var(--badSoft);color:var(--bad)}
.stamp.soon{background:var(--warnSoft);color:var(--warn)}
.danger-btn{width:100%;padding:14px;border-radius:16px;background:var(--card);color:var(--bad);font-weight:650;box-shadow:var(--shadow);margin-top:6px}

/* timeline */
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum3 .stat{padding:11px 12px}
.sum3 .stat .v{font-size:16px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h h3{margin:0;font-size:16px;font-weight:720;letter-spacing:-.02em}
.cal-h .icons button{width:32px;height:32px;border-radius:10px;background:var(--card2);display:grid;place-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .dow{font-size:11px;color:var(--text3);font-weight:650;padding-bottom:6px}
.cal button{aspect-ratio:1/1.05;border-radius:12px;font-size:13.5px;font-weight:580;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;transition:background .15s}
.cal button.mute{color:var(--text3);opacity:.45}
.cal button.today{color:var(--accent);font-weight:780}
.cal button.today:after{content:"";position:absolute;inset:3px;border-radius:10px;border:1.5px solid var(--accent);opacity:.5}
.cal button.sel{background:var(--accent);color:#fff}
.cal button.sel:after{display:none}
.cal button.past{color:var(--text3)}
.cal .pd{display:flex;gap:2px;height:5px}
.cal .pd i{width:5px;height:5px;border-radius:50%}
.cal button.sel .pd i{background:#fff!important}
.day-h{font-size:13px;font-weight:700;color:var(--text2);margin:18px 4px 8px;display:flex;justify-content:space-between}
.day-h.bad{color:var(--bad)}
.evt.paid{opacity:.55}
.empty{text-align:center;padding:30px 20px;color:var(--text3);font-size:14px}

/* planner */
.result{text-align:center;padding:22px 18px 18px}
.result .k{font-size:13px;color:var(--text2);font-weight:560}
.result .big{font-size:34px;font-weight:790;letter-spacing:-.045em;margin:4px 0 6px;background:linear-gradient(90deg,var(--accent),#2BB6F5);-webkit-background-clip:text;background-clip:text;color:transparent}
.slider-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.slider-h b{font-size:26px;font-weight:780;letter-spacing:-.04em}
.slider-h span{font-size:13px;color:var(--text2)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:9px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--track) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-9px;box-shadow:0 2px 8px rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.04)}
input[type=range]::-moz-range-track{height:8px;border-radius:9px;background:var(--track)}
input[type=range]::-moz-range-progress{height:8px;border-radius:9px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.quick{display:flex;gap:6px;margin-top:10px}
.quick button{flex:1;padding:7px 0;border-radius:10px;background:var(--card2);font-size:12.5px;font-weight:650;color:var(--text2);border:1px solid var(--line)}
.quick button.on{background:var(--accentSoft);color:var(--accent);border-color:transparent}
.strat-d{font-size:12.5px;color:var(--text2);margin-top:10px;line-height:1.45}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-size:10.5px;fill:var(--text3);font-family:inherit;font-weight:600}
.chart-legend{display:flex;gap:14px;font-size:12px;color:var(--text2);margin-top:4px}
.chart-legend span{display:flex;align-items:center;gap:6px}
.chart-legend i{width:14px;height:3px;border-radius:2px;display:block}
.order .rank{width:26px;height:26px;border-radius:9px;background:var(--bg2);display:grid;place-items:center;font-size:12px;font-weight:750;color:var(--text2);flex:none}

/* sheet */
.backdrop{position:absolute;inset:0;background:rgba(8,10,20,.42);z-index:40;opacity:0;transition:opacity .3s;backdrop-filter:blur(2px)}
.backdrop.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:28px 28px 0 0;max-height:92%;overflow-y:auto;padding:8px 18px 28px;
  transform:translateY(100%);transition:transform .42s var(--ease);scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet.show{transform:none}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 12px}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sheet-h h2{flex:1;margin:0;font-size:20px;font-weight:750;letter-spacing:-.03em}
.sheet-h .icon-btn{width:34px;height:34px;border-radius:12px}
.opt{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:15px;box-shadow:var(--shadow);margin-bottom:10px;width:100%;text-align:left;transition:transform .15s}
.opt:active{transform:scale(.98)}
.opt .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff}
.opt b{display:block;font-size:15px;font-weight:680;letter-spacing:-.02em}
.opt span{display:block;font-size:12.5px;color:var(--text2);margin-top:2px;line-height:1.35}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow);margin-bottom:14px;color:var(--text3)}
.search input{border:0;outline:0;background:none;flex:1;font-size:15px;color:var(--text)}
.banks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bank{background:var(--card);border-radius:16px;padding:14px 6px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:620;text-align:center;line-height:1.2}
.bank:active{transform:scale(.96)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:650;color:var(--text2);margin:0 0 6px 4px}
.field input,.field select{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid transparent;background:var(--card);box-shadow:var(--shadow);font-size:15.5px;outline:0;transition:border .2s;-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.field input.err{border-color:var(--bad)}
.field .pre{position:relative}
.field .pre span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-weight:600}
.field .pre.has-pre input{padding-left:28px}
.field .suf span{left:auto;right:14px}
.field .suf input{padding-left:14px;padding-right:32px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:15px;border-radius:16px;background:var(--accent);color:#fff;font-weight:700;font-size:15.5px;box-shadow:0 10px 24px -10px var(--accent);transition:transform .15s,opacity .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.btn[disabled]{opacity:.5}
.center{text-align:center}
.spin{width:54px;height:54px;border-radius:50%;border:4px solid var(--accentSoft);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:10px auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{display:flex;flex-direction:column;gap:10px;margin:8px auto 10px;max-width:270px}
.steps div{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text3);transition:color .3s}
.steps div.done{color:var(--text)}
.steps div i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;transition:all .3s}
.steps div.done i{background:var(--good);border-color:var(--good);color:#fff}
.success{width:72px;height:72px;border-radius:50%;background:var(--goodSoft);color:var(--good);display:grid;place-items:center;margin:8px auto 14px;animation:pop .5s var(--ease)}
.success svg.i{width:34px;height:34px;stroke-width:2.6}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.found{background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin:14px 0;overflow:hidden}
.mail{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;font-size:13px;margin-bottom:12px;position:relative;overflow:hidden}
.mail .from{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.mail .from .av{margin:0!important}
.mail .from b{font-size:13.5px}.mail .from span{font-size:12px;color:var(--text3)}
.mail p{margin:4px 0;color:var(--text2);line-height:1.45}
.mail mark{background:var(--warnSoft);color:var(--text);border-radius:4px;padding:0 3px;transition:background .4s}
.mail.scanning mark{animation:hl 1.6s ease both}
@keyframes hl{0%{background:transparent}100%{background:var(--warnSoft)}}
.addr{display:flex;align-items:center;gap:10px;background:var(--accentSoft);color:var(--accent);border-radius:14px;padding:12px 14px;font-weight:650;font-size:14px;margin:10px 0 14px}
.addr span{flex:1;word-break:break-all}
.shot{width:200px;margin:4px auto 16px;border-radius:24px;background:var(--card);box-shadow:var(--shadow2);padding:16px 14px;position:relative;overflow:hidden;font-size:11px}
.shot .scanline{position:absolute;left:0;right:0;height:46px;top:-46px;background:linear-gradient(180deg,transparent,rgba(91,91,240,.35));border-bottom:2px solid var(--accent);animation:scan 1.5s ease-in-out infinite}
@keyframes scan{to{top:100%}}
.shot .ln{height:7px;border-radius:4px;background:var(--bg2);margin:6px 0}
.shot .pp{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.p-text{font-size:13.5px;color:var(--text2);line-height:1.5;margin:0 0 14px}
.types{margin-bottom:14px}

/* settings */
.set .row{padding:13px 16px}
.set .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.tog{width:51px;height:31px;border-radius:99px;background:var(--line2);position:relative;transition:background .25s;flex:none}
.tog:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .3s var(--ease)}
.tog.on{background:var(--good)}
.tog.on:after{transform:translateX(20px)}
.set .seg{margin:0 16px 14px}
.foot{text-align:center;color:var(--text3);font-size:12px;line-height:1.6;margin:20px 0 10px}
.toast{position:absolute;left:50%;bottom:calc(var(--tab-h) + 14px);transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;
  font-size:13.5px;font-weight:620;z-index:60;opacity:0;transition:all .35s var(--ease);pointer-events:none;display:flex;gap:8px;align-items:center;white-space:nowrap;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confirm{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%) scale(.95);background:var(--card);border-radius:24px;padding:22px;z-index:51;opacity:0;transition:all .25s var(--ease);text-align:center;box-shadow:var(--shadow2)}
.confirm.show{opacity:1;transform:translateY(-50%)}
.confirm h3{margin:0 0 6px;font-size:18px;letter-spacing:-.02em}
.confirm p{margin:0 0 18px;color:var(--text2);font-size:14px;line-height:1.45}
.confirm .grid2 .btn{padding:13px}
.btn.red{background:var(--bad);box-shadow:0 10px 24px -10px var(--bad)}
.hide-amt .amt-h{filter:blur(7px);transition:filter .3s}

.row .s2{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text2);margin-top:2px}
.row .s2 span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s2 span:last-child{flex:none;font-variant-numeric:tabular-nums}

/* safe areas (notched phones, installed PWA) */
.top{padding-top:calc(22px + var(--sat))}
.dh{padding-top:calc(18px + var(--sat))}
.screen{padding-left:calc(18px + var(--sal));padding-right:calc(18px + var(--sar))}
.tabbar{padding-left:calc(8px + var(--sal));padding-right:calc(8px + var(--sar))}
.sheet{padding-bottom:calc(28px + var(--sab))}
.screen.push{padding-bottom:calc(40px + var(--sab))}
@media (display-mode: standalone) and (max-width:639px){ html,body{overscroll-behavior:none} }

</style>

<body>
<div class="app">
  <div id="main" class="screen"></div>
  <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
  <div id="toast" class="toast" role="status"></div>
</div>
<div class="desk-note">Due Diligence demo · sample data · view only</div>
<script>
"use strict";
/* ---------- utilities ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const DAY = 864e5;
const T = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addMonths = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth() + n, 1); x.setDate(Math.min(d.getDate(), daysIn(x))); return x; };
const daysIn = d => new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
const dayDiff = (a, b) => Math.round((b - a) / DAY);
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTH = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fDate = d => `${MON[d.getMonth()]} ${d.getDate()}`;
const fMonthYear = d => `${MONTH[d.getMonth()]} ${d.getFullYear()}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function money(n, cents = false) {

/* ---------- payoff math ----------

   extra) goes to the focus debt. When a debt is paid off its minimum "rolls over" because

function planDebts() {
  return S.accounts.filter(a => a.balance > 0.005).map(a => ({ id: a.id, name: a.name, type: a.type, bal: a.balance, apr: a.type === "bnpl" ? 0 : a.apr, min: Math.min(a.min, a.balance) }));

    let avail = budget;
    for (const d of ds) if (d.bal > 0) { const p = Math.min(d.min, d.bal); d.bal -= p; avail -= p; }
    if (rollover) {
      const order = ds.filter(d => d.bal > 0.005).sort(strategy === "snowball" ? (a, b) => a.bal - b.bal : (a, b) => b.apr - a.apr || a.bal - b.bal);

    }

  return `<svg width="54" height="54" viewBox="0 0 54 54" style="transform:rotate(-90deg)"><circle cx="27" cy="27" r="${r}" fill="none" stroke="var(--track)" stroke-width="5"/><circle cx="27" cy="27" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(c * p).toFixed(1)} ${c.toFixed(1)}"/></svg>`;
}
function donut(t) {
  let segs;
  if (S.settings.breakdown === "type") segs = Object.keys(TYPE).map(k => ({ label: TYPE[k].short, v: t.by[k], color: TYPE[k].color }));
  else {
    const m = {};
    S.accounts.forEach(a => { const k = a.type === "bnpl" ? a.provider : a.lender; m[k] = m[k] || { label: k, v: 0, color: solid(a.color) }; m[k].v += a.balance; });
    segs = Object.values(m).sort((a, b) => b.v - a.v);
    if (segs.length > 6) { const rest = segs.slice(5); segs = segs.slice(0, 5); segs.push({ label: `${rest.length} others`, v: rest.reduce((s, x) => s + x.v, 0), color: "#A1A1AA" }); }
  }
  segs = segs.filter(s => s.v > 0);
  const r = 52, c = 2 * Math.PI * r, gap = segs.length > 1 ? 3 : 0;
  let off = 0;
  const circles = segs.map(s => { const len = Math.max(0, c * s.v / t.total - gap); const el = `<circle cx="66" cy="66" r="${r}" fill="none" stroke="${s.color}" stroke-width="14" stroke-linecap="butt" stroke-dasharray="${len.toFixed(2)} ${c.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`; off += c * s.v / t.total; return el; }).join("");
  return `<div class="donut-wrap"><div class="donut"><svg width="132" height="132" viewBox="0 0 132 132"><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--track)" stroke-width="14"/>${circles}</svg>
    <div class="ctr"><div><b class="num">${money(t.total)}</b><small>${segs.length} ${S.settings.breakdown === "type" ? "types" : "lenders"}</small></div></div></div>
    <div class="legend">${segs.map(s => `<div><i style="background:${s.color}"></i><span>${esc(s.label)}</span><b>${money(s.v)}</b><em>${Math.round(s.v / t.total * 100)}%</em></div>`).join("")}</div></div>`;
}
function evtRow(e) {

   <div class="big num">${bigMoney(a.balance)}</div><div class="s">${a.type === "bnpl" ? "Left to pay" : a.type === "card" ? "Current balance" : "Principal remaining"}</div></div>`;

      <div class="note">Paying only the minimum, this card takes <b>${duration(sp.months)}</b> to clear and costs <b class="num">${money(sp.interest)}</b> in interest.</div></div>

function history(a) {
  const out = [];
  const seed = a.id.split("").reduce((s, c) => s + c.charCodeAt(0), 0);
  for (let k = 1; k <= 5; k++) {
    const d = addMonths(nextMonthly(a.dueDay), -k);
    const amt = a.type === "card" ? a.min + ((seed * k * 37) % 5) * 45 : a.min;
    out.push(`<div class="row"><div class="stamp paid">${ic("check", "sm")}</div><div class="mid"><div class="t">${a.type === "card" ? "Payment received" : "Monthly payment"}</div><div class="s">${fDate(d)}, ${d.getFullYear()} · on time</div></div><div class="r"><div class="t num">${m2(amt)}</div></div></div>`);
  }
  return out;
}

/* ---------- TIMELINE ---------- */
function renderTimeline() {
  const m = S.calMonth, y = m.getFullYear(), mo = m.getMonth();
  const mStart = new Date(y, mo, 1), mEnd = new Date(y, mo, daysIn(m));
  const evs = events(mStart, mEnd), od = overdue();
  const wk = events(T, addDays(T, 6)).filter(e => !e.paid);
  const rest = evs.filter(e => !e.paid && e.date >= T);
  const byDay = {}; evs.forEach(e => { const k = e.date.getDate(); (byDay[k] = byDay[k] || []).push(e); });
  const lead = mStart.getDay(), cells = Math.ceil((lead + daysIn(m)) / 7) * 7;
  let cal = DOW.map(d => `<div class="dow">${d[0]}</div>`).join("");
  for (let c = 0; c < cells; c++) {
    const d = addDays(mStart, c - lead), inM = d.getMonth() === mo, list = inM ? (byDay[d.getDate()] || []) : [];
    const dots = list.slice(0, 3).map(e => `<i style="background:${status(e) === "late" ? "var(--bad)" : solid(e.a.color)};${e.paid ? "opacity:.35" : ""}"></i>`).join("");
    const sel = S.calSel && sameDay(S.calSel, d);
    cal += `<button class="${inM ? "" : "mute"} ${sameDay(d, T) ? "today" : ""} ${sel ? "sel" : ""} ${d < T && inM ? "past" : ""}" data-act="day" data-d="${d.getTime()}" ${inM ? "" : "disabled"}><span>${d.getDate()}</span><span class="pd">${dots}</span></button>`;
  }
  let list = "";
  if (S.calSel) {
    const day = evs.filter(e => sameDay(e.date, S.calSel));
    list = `<div class="day-h"><span>${DOW[S.calSel.getDay()]}, ${fDate(S.calSel)}</span><button class="link" data-act="day" data-d="">Show all</button></div>` +
      (day.length ? `<div class="card tight">${day.map(evtRow).join("")}</div>` : `<div class="card empty">Nothing due this day. Enjoy it.</div>`);
  } else {
    const isCur = y === T.getFullYear() && mo === T.getMonth();
    if (od.length) list += `<div class="day-h bad"><span>Overdue</span><span class="num">${m2(od.reduce((s, e) => s + e.amount, 0))}</span></div><div class="card tight">${od.map(evtRow).join("")}</div>`;
    const src = isCur ? events(T, addDays(T, 30)).filter(e => !e.paid) : evs.filter(e => status(e) !== "late");
    const groups = {}; src.forEach(e => { const k = e.date.getTime(); (groups[k] = groups[k] || []).push(e); });
    const keys = Object.keys(groups).map(Number).sort((a, b) => a - b);
    if (isCur && keys.length) list += `<div class="sec-t" style="margin-top:22px">Next 30 days</div>`;
    list += keys.map(k => { const d = new Date(k), g = groups[k]; const n = dayDiff(T, d);
      return `<div class="day-h"><span>${n === 0 ? "Today" : n === 1 ? "Tomorrow" : DOW[d.getDay()]} · ${fDate(d)}</span><span class="num">${m2(g.reduce((s, e) => s + e.amount, 0))}</span></div><div class="card tight">${g.map(evtRow).join("")}</div>`; }).join("");
    if (isCur) { const earlier = evs.filter(e => e.paid); if (earlier.length) list += `<div class="sec-t" style="margin-top:26px">Earlier in ${MONTH[mo]}<span class="lite">${earlier.length} paid</span></div><div class="card tight">${earlier.reverse().map(evtRow).join("")}</div>`; }
    if (!keys.length && !od.length) list = `<div class="card empty">No payments this month.</div>`;
  }
  return `<div class="top"><div><h1>Timeline</h1><div class="sub">Every due date, every lender</div></div>
    <button class="icon-btn" data-act="today" aria-label="Jump to today">${ic("cal")}</button></div>
  <div class="stagger">
  <div class="sum3">
    <div class="stat"><div class="k">Overdue</div><div class="v num" style="color:${od.length ? "var(--bad)" : "var(--text)"}">${od.length ? m2(od.reduce((s, e) => s + e.amount, 0)) : "None"}</div></div>
    <div class="stat"><div class="k">Next 7 days</div><div class="v num">${money(wk.reduce((s, e) => s + e.amount, 0))}</div></div>
    <div class="stat"><div class="k">${y === T.getFullYear() && mo === T.getMonth() ? "Next 30 days" : "Due in " + MON[mo]}</div><div class="v num">${money((y === T.getFullYear() && mo === T.getMonth() ? events(T, addDays(T, 29)).filter(e => !e.paid) : rest).reduce((s, e) => s + e.amount, 0))}</div></div>
  </div>
  <div class="card"><div class="cal-h"><h3>${MONTH[mo]} ${y}</h3><div class="icons"><button data-act="cal" data-v="-1" aria-label="Previous month">${ic("left", "sm")}</button><button data-act="cal" data-v="1" aria-label="Next month">${ic("right", "sm")}</button></div></div>
    <div class="cal">${cal}</div></div>
  <div>${list}</div></div>`;
}

/* ---------- PLANNER ---------- */

  return `<div class="top"><div><h1>Payoff planner</h1><div class="sub">See when you'll be debt-free</div></div></div>
  <div class="stagger">
  <div class="card">
    <div class="seg"><button class="${st === "avalanche" ? "on" : ""}" data-act="strategy" data-v="avalanche">Avalanche</button><button class="${st === "snowball" ? "on" : ""}" data-act="strategy" data-v="snowball">Snowball</button></div>
    <div class="strat-d" id="stratD">${st === "avalanche" ? "<b>Highest interest first.</b> Saves the most money overall." : "<b>Smallest balance first.</b> Quick wins that keep you motivated."}</div>
  </div>
  <div class="card">
    <div class="slider-h"><div><div style="font-size:13px;color:var(--text2);font-weight:560">Extra each month</div><b class="num" id="exV">${money(ex)}</b></div><span id="budV" class="num"></span></div>
    <input type="range" id="extra" min="0" max="1000" step="25" value="${ex}" aria-label="Extra monthly payment" style="--p:${ex / 10}%">
    <div class="quick">${[0, 50, 100, 250, 500].map(v => `<button class="${v === ex ? "on" : ""}" data-act="extra" data-v="${v}">${v ? "+$" + v : "$0"}</button>`).join("")}</div>
  </div>
  <div id="planOut">${planOut()}</div></div>`;
}
function planOut() {
  const st = S.settings.strategy, ex = S.settings.extra;
  const sim = simulate(st, ex), base = simulate(st, 0, false), other = simulate(st === "avalanche" ? "snowball" : "avalanche", ex);
  const m0 = new Date(T.getFullYear(), T.getMonth(), 1), free = addMonths(m0, sim.months), sooner = base.months - sim.months, saved = base.interest - sim.interest;
  const order = Object.entries(sim.payoff).sort((a, b) => a[1] - b[1]);
  const diff = other.interest - sim.interest;
  return `<div class="card result">
    <div class="k">You'll be debt-free in</div><div class="big">${fMonthYear(free)}</div>
    <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap"><span class="chip acc">${duration(sim.months)}</span>${sooner > 0 ? `<span class="chip good">${duration(sooner)} sooner</span>` : ""}</div>
  </div>
  <div class="stats">

function chart(sim, base) {
  const W = 330, H = 170, pl = 6, pr = 6, pt = 10, pb = 22;
  const n = Math.max(base.months, sim.months), maxY = Math.max(...base.series, ...sim.series);
  const x = i => pl + i / n * (W - pl - pr), yv = v => pt + (1 - v / maxY) * (H - pt - pb);
  const path = s => s.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${yv(v).toFixed(1)}`).join("");
  const area = path(sim.series) + `L${x(sim.series.length - 1).toFixed(1)},${yv(0)}L${x(0)},${yv(0)}Z`;
  let ticks = "";
  const y0 = T.getFullYear(), stepY = n > 96 ? 2 : 1;
  for (let yr = y0 + 1; ; yr += stepY) { const i = (yr - y0) * 12 - T.getMonth(); if (i > n) break; ticks += `<line x1="${x(i)}" x2="${x(i)}" y1="${pt}" y2="${H - pb}" stroke="var(--line)"/><text x="${x(i)}" y="${H - 6}" text-anchor="middle">${"'" + String(yr).slice(2)}</text>`; }
  const ex = x(sim.months), ey = yv(0);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${ticks}<line x1="${pl}" x2="${W - pr}" y1="${yv(0)}" y2="${yv(0)}" stroke="var(--line2)"/>
    <path d="${path(base.series)}" fill="none" stroke="var(--text3)" stroke-width="2" stroke-dasharray="4 4" opacity=".7"/>
    <path d="${area}" fill="url(#g1)"/><path d="${path(sim.series)}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round"/>
    <circle cx="${ex}" cy="${ey}" r="5" fill="var(--card)" stroke="var(--accent)" stroke-width="2.6"/>
    <text x="${ex + 9}" y="${ey - 8}" style="fill:var(--accent);font-weight:750">Debt-free ${MON[addMonths(T, sim.months).getMonth()]} '${String(addMonths(T, sim.months).getFullYear()).slice(2)}</text>
    <text x="${W - pr}" y="${pt + 4}" text-anchor="end" style="font-weight:650">${money(maxY)} today</text></svg>`;
}

function insights() {
  const out = [], cards = S.accounts.filter(a => a.type === "card"), bnpl = S.accounts.filter(a => a.type === "bnpl" && a.balance > 0);
  overdue().forEach(e => out.push({ tone: "bad", icon: "alert", title: `${e.a.provider || e.a.lender} payment is ${-dayDiff(T, e.date)} days late`, body: `${m2(e.amount)} for ${e.a.name} was due ${fDate(e.date)}. Paying it soon can help you avoid a late fee.`, act: ["detail", e.a.id, "View plan"] }));
  const costly = [...cards].sort((a, b) => monthlyInterest(b) - monthlyInterest(a))[0];
  if (costly) out.push({ tone: "bad", icon: "fire", title: `${costly.name} costs you ${money(monthlyInterest(costly))}/mo in interest`, body: `That's about ${money(monthlyInterest(costly) * 12)} a year at ${costly.apr.toFixed(2)}% APR, your most expensive debt. Avalanche pays it off first.`, act: ["detail", costly.id, "See interest"] });
  cards.filter(a => a.balance / a.limit >= .5).forEach(a => { const p = Math.round(a.balance / a.limit * 100);
    out.push({ tone: "warn", icon: "gauge", title: `Utilization on ${a.name} is ${p}%`, body: `Getting it under 30% means paying it down to ${money(a.limit * .3)}, which usually gives your credit score a lift.`, act: ["detail", a.id, "View card"] }); });
  const ends = {};
  bnpl.forEach(a => { const last = a.installments[a.installments.length - 1].date; const k = `${a.provider}|${last.getFullYear()}-${last.getMonth()}`; (ends[k] = ends[k] || []).push(a); });
  Object.entries(ends).filter(([, v]) => v.length >= 2).forEach(([k, v]) => { const [prov] = k.split("|"), d = v[0].installments[v[0].installments.length - 1].date;
    out.push({ tone: "good", icon: "gift", title: `${v.length} ${prov} plans end in ${MONTH[d.getMonth()]}`, body: `${v.map(a => a.name).join(" and ")} wrap up, freeing about ${money(v.reduce((s, a) => s + monthlyEquiv(a), 0))}/mo. Point it at a card to save on interest.`, act: ["tab", "planner", "Try it in the planner"] }); });
  if (bnpl.length) { const provs = new Set(bnpl.map(a => a.provider)).size;
    out.push({ tone: "acc", icon: "bag", title: `${bnpl.length} pay-later plans add up to ${money(bnpl.reduce((s, a) => s + a.balance, 0))}`, body: `That's about ${money(bnpl.reduce((s, a) => s + monthlyEquiv(a), 0))}/mo spread across ${provs} apps, the kind of debt that's easy to lose track of.`, act: ["filter", "bnpl", "See plans"] }); }
  const s0 = simulate(S.settings.strategy, 0), s50 = simulate(S.settings.strategy, 50);
  if (s0.months - s50.months > 0) out.push({ tone: "acc", icon: "trend", title: `An extra $50/mo saves ${money(s0.interest - s50.interest)}`, body: `You'd be debt-free ${duration(s0.months - s50.months)} sooner, in ${fMonthYear(addMonths(new Date(T.getFullYear(), T.getMonth(), 1), s50.months))}.`, act: ["extra", "50", "Apply in planner"] });
  // busiest week in the next 30 days
  const up = events(T, addDays(T, 34)).filter(e => !e.paid); let best = null;
  for (let i = 0; i < 28; i++) { const a = addDays(T, i), b = addDays(T, i + 6); const w = up.filter(e => e.date >= a && e.date <= b); if (!best || w.length > best.w.length) best = { a, b, w }; }
  if (best && best.w.length >= 3) out.push({ tone: "warn", icon: "cal", title: `Busy week: ${best.w.length} payments ${fDate(best.a)}–${fDate(best.b)}`, body: `${m2(best.w.reduce((s, e) => s + e.amount, 0))} goes out to ${new Set(best.w.map(e => e.a.lender)).size} lenders that week. Worth checking your balance beforehand.`, act: ["tab", "timeline", "Open timeline"] });
  const av = simulate("avalanche", S.settings.extra), sb = simulate("snowball", S.settings.extra);
  if (sb.interest - av.interest > 5) out.push({ tone: "acc", icon: "target", title: `Avalanche saves ${money(sb.interest - av.interest)} over snowball`, body: `Snowball clears your first debt sooner, which some people find motivating. Either way beats minimums only.`, act: ["tab", "planner", "Compare"] });
  const good = cards.filter(a => a.balance / a.limit < .3).sort((a, b) => a.balance / a.limit - b.balance / b.limit)[0];
  if (good) out.push({ tone: "good", icon: "shield", title: `${good.name} is at a healthy ${Math.round(good.balance / good.limit * 100)}%`, body: `Keeping this card low helps your overall utilization, which is ${Math.round(cards.reduce((s, a) => s + a.balance, 0) / cards.reduce((s, a) => s + a.limit, 0) * 100)}% across all cards.` });
  const loan = S.accounts.filter(a => a.type === "loan").sort((a, b) => (1 - b.balance / b.original) - (1 - a.balance / a.original))[0];
  if (loan) out.push({ tone: "good", icon: "check", title: `${loan.name.split(" ·")[0]} is ${Math.round((1 - loan.balance / loan.original) * 100)}% paid off`, body: `${money(loan.original - loan.balance)} down, ${money(loan.balance)} to go. Nice steady progress.`, act: ["detail", loan.id, "View loan"] });
  return out;
}

    <div class="grid2"><div class="field"><label for="mFreq">How often</label><select id="mFreq"><option value="biweekly">Every 2 weeks</option><option value="monthly">Monthly</option></select></div>${f("mNext", "Next payment in", "7", 'inputmode="numeric"', "", "days")}</div>`;
  else body = `${f("mName", type === "card" ? "Card name" : "Loan name", type === "card" ? "e.g. Store Rewards Card" : "e.g. Personal Loan")}${f("mLender", "Lender", "e.g. Evergreen Bank")}
    <div class="grid2">${f("mBal", "Balance", "2,500", num, "$")}${f("mApr", "APR", "24.99", num, "", "%")}</div>
    <div class="grid2">${f("mMin", type === "card" ? "Minimum payment" : "Monthly payment", "75", num, "$")}${f("mDay", "Due day", "15", 'inputmode="numeric"', "", "th")}</div>
    ${type === "card" ? f("mLimit", "Credit limit", "5,000", num, "$") : f("mOrig", "Original amount (optional)", "10,000", num, "$")}`;
  return `<div class="seg types">${[["card", "Card"], ["loan", "Loan"], ["bnpl", "Pay later"]].map(([k, l]) => `<button class="${type === k ? "on" : ""}" data-act="mtype" data-v="${k}">${l}</button>`).join("")}</div>
    <form id="mForm" novalidate>${body}<div id="mErr" style="color:var(--bad);font-size:13px;margin:0 4px 10px;min-height:0"></div><button class="btn" type="submit">Add account</button></form>`;
}
function readManual() {
  const type = sheetState.type || "card", v = id => ($("#" + id) ? $("#" + id).value.trim() : ""), n = id => parseFloat(v(id).replace(/[$,%\s]/g, ""));
  const bad = []; const need = (id, ok) => { const el = $("#" + id); if (!ok) { bad.push(id); el && el.classList.add("err"); } else el && el.classList.remove("err"); };
  const color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
  if (type === "bnpl") {
    need("mName", v("mName")); need("mAmt", n("mAmt") > 0); need("mLeft", n("mLeft") >= 1 && n("mLeft") <= 60); need("mNext", n("mNext") >= 0 && n("mNext") <= 60);
    if (bad.length) return null;
    const left = Math.round(n("mLeft")), freq = v("mFreq"), next = addDays(T, Math.round(n("mNext")));
    return finalize(plan({ id: uid(), provider: v("mProv"), merchant: v("mName"), color: grad(color), total: n("mAmt") * left, n: left, paid: 0, amount: n("mAmt"), freq, nextDate: next, aprShown: 0, addedVia: "Added manually" }));
  }
  need("mName", v("mName")); need("mLender", v("mLender")); need("mBal", n("mBal") > 0); need("mApr", n("mApr") >= 0 && n("mApr") < 100);
  need("mMin", n("mMin") > 0); need("mDay", n("mDay") >= 1 && n("mDay") <= 31);
  if (type === "card") need("mLimit", n("mLimit") > 0);
  if (!bad.length && n("mApr") > 0 && n("mMin") <= n("mBal") * n("mApr") / 1200) { bad.push("mMin"); $("#mMin").classList.add("err"); $("#mErr").textContent = "That payment doesn't cover the monthly interest, so the balance would never go down."; return null; }
  if (bad.length) { $("#mErr").textContent = "Please fill in the highlighted fields."; return null; }
  const a = { id: uid(), type, name: v("mName"), lender: v("mLender"), mask: String(1000 + Math.floor(Math.random() * 9000)), color: grad(color), balance: n("mBal"), apr: n("mApr"), min: n("mMin"), dueDay: Math.min(28, Math.round(n("mDay"))), addedVia: "Added manually" };
  if (type === "card") a.limit = n("mLimit"); else a.original = Math.max(n("mOrig") || a.balance, a.balance);
  return a;
}
function addAccount(a) {
  S.added.push(a); save(); rebuild(); closeSheet(); S.acctFilter = "all";
  go("accounts"); toast(`${a.name} added`);
  setTimeout(() => { const el = $(`.screen [data-id="${a.id}"]`); if (el) { el.scrollIntoView({ block: "center", behavior: "smooth" }); el.animate([{ background: "var(--accentSoft)" }, { background: "transparent" }], { duration: 1600, easing: "ease-out" }); } }, 450);
}

/* ---------- navigation ---------- */
const TABS = [["home", "Home", "home"], ["accounts", "Accounts", "wallet"], ["timeline", "Timeline", "cal"], ["planner", "Planner", "target"], ["insights", "Insights", "spark"]];
const RENDER = { home: renderHome, accounts: renderAccounts, timeline: renderTimeline, planner: renderPlanner, insights: renderInsights };
let pushStack = [];
function go(tab, opts = {}) {
  S.tab = tab; closePushes(true);
  const main = $("#main"); main.className = "screen" + (opts.quiet ? "" : " enter");
  if (!opts.keepScroll) main.scrollTop = 0;
  const st = opts.keepScroll ? main.scrollTop : 0;
  main.innerHTML = RENDER[tab](); main.scrollTop = st;
  renderTabs(); afterRender(main, opts);
}
function renderTabs() {
  const od = overdue().length;
  $("#tabbar").innerHTML = TABS.map(([k, l, i]) => `<button class="tab ${S.tab === k ? "on" : ""}" data-act="tab" data-tab="${k}" aria-label="${l}">${ic(i)}<span>${l}</span>${k === "timeline" && od ? `<span class="badge">${od}</span>` : ""}</button>`).join("");
}
function push(kind, id) {
  const el = document.createElement("div"); el.className = "screen push"; el.dataset.kind = kind; el.dataset.id = id || "";
  el.innerHTML = kind === "detail" ? renderDetail(id) : renderSettings();
  el.addEventListener("scroll", () => { const h = $(".dh", el); if (h && kind === "detail") h.classList.toggle("scrolled", el.scrollTop > 150); });
  $(".app").insertBefore(el, $("#tabbar").nextSibling); pushStack.push(el);
}
function pop() { const el = pushStack.pop(); if (!el) return; el.classList.add("leaving"); setTimeout(() => el.remove(), 300); }
function closePushes(instant) { while (pushStack.length) { const el = pushStack.pop(); instant ? el.remove() : (el.classList.add("leaving"), setTimeout(() => el.remove(), 300)); } }
function refreshAll() {
  const main = $("#main"), st = main.scrollTop; main.innerHTML = RENDER[S.tab](); main.scrollTop = st; renderTabs(); afterRender(main, { quiet: true });
  pushStack.forEach(el => { const s2 = el.scrollTop; el.innerHTML = el.dataset.kind === "detail" ? renderDetail(el.dataset.id) : renderSettings(); el.scrollTop = s2; });
}
function afterRender(root, opts) {
  if (S.tab === "home" && !opts.quiet && !S.settings.hide) {
    const el = $("[data-count]", root); if (el) { const target = +el.dataset.count, t0 = performance.now();
      const stepF = now => { const p = Math.min(1, (now - t0) / 900), e = 1 - Math.pow(1 - p, 3); el.innerHTML = bigMoney(target * e); if (p < 1) requestAnimationFrame(stepF); }; requestAnimationFrame(stepF); }
  }
  if (S.tab === "planner") wirePlanner();
}
function wirePlanner() {
  const r = $("#extra"); if (!r) return;
  const upd = () => { $("#exV").textContent = money(S.settings.extra); r.style.setProperty("--p", S.settings.extra / 10 + "%"); $$(".quick button").forEach(b => b.classList.toggle("on", +b.dataset.v === S.settings.extra)); $("#planOut").innerHTML = planOut(); };
  r.addEventListener("input", () => { S.settings.extra = +r.value; upd(); });
  r.addEventListener("change", save);
  wirePlanner.upd = upd;
}
function applyTheme() {
  const t = S.settings.theme, dark = t === "dark" || (t === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light"; document.body.classList.toggle("dark", dark);
  const m = $('meta[name="theme-color"]'); if (m) m.content = dark ? "#0B0C12" : "#F3F4F8";
}
let toastT;
function toast(msg) { const t = $("#toast"); t.innerHTML = `${ic("check", "sm")}${esc(msg)}`; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200); }
function confirmBox(title, text, okLabel, onOk) {
  const bd = document.createElement("div"); bd.className = "backdrop"; bd.style.zIndex = 50;
  const c = document.createElement("div"); c.className = "confirm"; c.setAttribute("role", "alertdialog");
  c.innerHTML = `<h3>${title}</h3><p>${text}</p><div class="grid2"><button class="btn ghost" data-x="no">Cancel</button><button class="btn red" data-x="ok">${okLabel}</button></div>`;
  $(".app").append(bd, c); requestAnimationFrame(() => { bd.classList.add("show"); c.classList.add("show"); });
  const close = () => { bd.classList.remove("show"); c.classList.remove("show"); setTimeout(() => { bd.remove(); c.remove(); }, 260); };
  bd.onclick = close; c.onclick = e => { const x = e.target.closest("[data-x]"); if (!x) return; close(); if (x.dataset.x === "ok") onOk(); };
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  switch (act) {
    case "tab": closeSheet(); go(b.dataset.tab); break;
    case "detail": push("detail", b.dataset.id); break;
    case "settings": push("settings"); break;
    case "back": pop(); break;
    case "add": openSheet("menu"); break;
    case "closeSheet": closeSheet(); break;
    case "sheet": openSheet(v, v === "manual" ? { type: "card" } : {}); if (v === "connect") wireBankSearch(); break;
    case "bank": openSheet("login", { bank: v, color: b.dataset.c }); break;
    case "connectGo": { const bank = sheetState.bank, color = sheetState.color; openSheet("connecting");
      const steps = $$("#steps div"); steps.forEach((s, i) => setTimeout(() => { s.classList.add("done"); s.querySelector("i").innerHTML = ic("check", "sm"); }, 500 + i * 550));
      setTimeout(() => { const acct = { id: uid(), type: "card", name: `${bank.split(" ")[0]} Platinum Card`, lender: bank, mask: String(4000 + Math.floor(Math.random() * 5999)), color: grad(color), balance: 1642.18, limit: 5000, apr: 24.74, min: 50, dueDay: 20, addedVia: "Connected" }; openSheet("found", { acct }); sheetState.pending = acct; }, 2300); break; }
    case "emailGo": openSheet("emailScan"); setTimeout(() => { const acct = finalize(plan({ id: uid(), provider: "Affirm", merchant: "Nova Hybrid Mattress", color: grad("#6366F1"), total: 1196, n: 12, paid: 1, amount: 99.67, freq: "monthly", nextDate: nextMonthly(14), aprShown: 0, addedVia: "From email" })); openSheet("detected", { acct, back: "email" }); sheetState.pending = acct; }, 2000); break;
    case "scanGo": openSheet("scanning"); setTimeout(() => { const acct = finalize(plan({ id: uid(), provider: "Klarna", merchant: "Atlas Smart Watch", color: grad("#EC4899"), total: 350, n: 4, paid: 1, amount: 87.5, freq: "biweekly", nextDate: addDays(T, 8), aprShown: 0, addedVia: "From screenshot" })); openSheet("detected", { acct, back: "scan" }); sheetState.pending = acct; }, 1900); break;
    case "addPending": if (sheetState.pending) addAccount(sheetState.pending); break;
    case "copy": toast("Address copied"); try { navigator.clipboard && navigator.clipboard.writeText("kevin.bills@duediligence.demo").catch(() => {}); } catch (x) {} break;
    case "mtype": openSheet("manual", { type: v }); break;
    case "remove": { const a = byId(b.dataset.id); confirmBox("Remove account?", `${esc(a.name)} will be removed from your list.`, "Remove", () => { S.added = S.added.filter(x => x.id !== a.id); save(); rebuild(); pop(); refreshAll(); toast("Account removed"); }); break; }
    case "filter": S.acctFilter = v; go("accounts", { quiet: true }); break;
    case "gofilter": S.acctFilter = v; go("accounts"); break;
    case "goextra": S.settings.extra = +v; save(); go("planner"); break;
    case "breakdown": S.settings.breakdown = v; save(); refreshAll(); break;
    case "toggleHide": S.settings.hide = !S.settings.hide; save(); refreshAll(); break;
    case "day": S.calSel = v ? new Date(+v) : null; if (S.calSel && S.calSel && b.classList.contains("sel")) S.calSel = null; refreshAll(); break;
    case "cal": S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth() + +v, 1); S.calSel = null; refreshAll(); break;
    case "today": S.calMonth = new Date(T.getFullYear(), T.getMonth(), 1); S.calSel = null; refreshAll(); break;
    case "strategy": S.settings.strategy = v; save(); $$("[data-act=strategy]").forEach(x => x.classList.toggle("on", x.dataset.v === v));
      $("#stratD").innerHTML = v === "avalanche" ? "<b>Highest interest first.</b> Saves the most money overall." : "<b>Smallest balance first.</b> Quick wins that keep you motivated."; $("#planOut").innerHTML = planOut(); break;
    case "extra": S.settings.extra = +v; $("#extra").value = v; save(); wirePlanner.upd(); break;
    case "theme": S.settings.theme = v; save(); applyTheme(); refreshAll(); break;
    case "tog": S.settings[b.dataset.k] = !S.settings[b.dataset.k]; save(); if (b.dataset.k === "hide") refreshAll(); else { refreshAll(); } if (b.dataset.k === "reminders") toast(S.settings.reminders ? "Reminders on (demo)" : "Reminders off"); break;
    case "lead": S.settings.leadDays = +v; save(); refreshAll(); break;
    case "resetAsk": confirmBox("Reset the demo?", "This removes accounts you added and restores the original sample data and settings.", "Reset", () => {
      try { localStorage.removeItem(KEY); } catch (x) {} S.added = []; S.removed = []; S.settings = { ...DEFAULT_SETTINGS }; S.acctFilter = "all"; S.calSel = null; rebuild(); applyTheme(); refreshAll(); toast("Demo reset"); }); break;
  }
});
document.addEventListener("input", e => { if (e.target.matches(".field input")) { e.target.classList.remove("err"); const m = $("#mErr"); if (m && !document.querySelector(".field input.err")) m.textContent = ""; } });
document.addEventListener("change", e => { if (e.target.matches("[data-act=time]")) { S.settings.time = e.target.value; save(); refreshAll(); } });
document.addEventListener("submit", e => { if (e.target.id === "mForm") { e.preventDefault(); const a = readManual(); if (a) addAccount(a); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") { if ($(".sheet")) closeSheet(); else pop(); } });
function wireBankSearch() { const q = $("#bankQ"); if (q) q.addEventListener("input", () => { $("#bankGrid").innerHTML = bankGrid(q.value); }); }
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (S.settings.theme === "auto") { applyTheme(); } });

/* ---------- boot ---------- */
load(); applyTheme(); go("home");
window.__demo = { S, simulate, planDebts, insights, events, overdue };

</script>

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
